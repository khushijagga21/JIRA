# Render Blueprint — workSphere API (free tier)
# Disks are NOT available on Render free — data lives in /tmp (resets on redeploy).
# For persistent DB/uploads, upgrade to a paid Render plan and add a disk block back.
#
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → pick repo
# Then set VITE_API_URL on Vercel to the Render service URL.
services:
  - type: web
    name: worksphere-api
    runtime: node
    plan: free
    rootDir: jira-ui
    buildCommand: npm install --omit=dev --ignore-scripts
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: WORKSPHERE_DATA_DIR
        value: /tmp/worksphere-data
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
